name: Daily Market Data

# Scheduling moved off GitHub Actions to the Mac Mini launchd agent
# (com.eit.market-data.daily, Mon-Fri 07:30 KST) to avoid hosted-runner
# billing. This workflow is kept only as a manual self-hosted fallback.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-data
  cancel-in-progress: true

jobs:
  run-daily-batch:
    runs-on: [self-hosted, macOS, eit-market-data]
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync dependencies
        run: uv sync --python 3.11 --extra all --extra dev

      - name: Run daily batch (KR + US snapshots)
        run: uv run python scripts/run_daily_batch.py

      - name: Upload batch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-batch-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload snapshots to release
        if: success() && hashFiles('out/*/artifacts/snapshots/*/*.json') != ''
        uses: softprops/action-gh-release@v1
        with:
          files: |
            out/*/artifacts/snapshots/*/*.json
          tag_name: snapshot-${{ github.event.schedule || 'manual' }}-${{ github.run_id }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
